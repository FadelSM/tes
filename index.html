<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Slide Musik dengan Background</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<!-- Kontainer Utama dengan Background -->
<div class="app-container">
    
    <!-- Lapisan transparan (overlay) agar background tidak terlalu terang -->
    <div class="overlay"></div>

    <div class="slide-container">
        <!-- Item 1 -->
        <div class="music-item">
            <div class="music-player-screenshot">
                <!-- Ganti dengan URL gambar screenshot musik Anda -->
                <img src="musik1.jpg" alt="Screenshot Musik 1">
            </div>
            <div class="person-photo">
                <!-- Ganti dengan URL foto orang Anda (format PNG tanpa background) -->
                <img src="orang1.png" alt="Orang 1">
            </div>
        </div>

        <!-- Item 2 -->
        <div class="music-item">
            <div class="music-player-screenshot">
                 <!-- Ganti dengan URL gambar screenshot musik Anda -->
                <img src="musik2.jpg" alt="Screenshot Musik 2">
            </div>
            <div class="person-photo">
                <!-- Ganti dengan URL foto orang Anda -->
                <img src="orang2.png" alt="Orang 2">
            </div>
        </div>

        <!-- Item 3 -->
        <div class="music-item">
            <div class="music-player-screenshot">
                 <!-- Ganti dengan URL gambar screenshot musik Anda -->
                <img src="musik3.jpg" alt="Screenshot Musik 3">
            </div>
            <div class="person-photo">
                <!-- Ganti dengan URL foto orang Anda -->
                <img src="orang3.png" alt="Orang 3">
            </div>
        </div>
    </div>

</div>

</body>
</html>
